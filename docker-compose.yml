services:
  # Frontend React/Vite con Nginx
  ritmo-frontend:
    build:
      context: ./ritmo-frontend/landing
    container_name: ritmo-frontend
    restart: unless-stopped

  # Backend FastAPI
  ritmo-backend:
    build:
      context: ./ritmo-backend
    container_name: ritmo-backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ENVIRONMENT=production
    restart: unless-stopped

  # Telegram Bot
  telegram-bot:
    build:
      context: ./telegram-bot
    container_name: telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BACKEND_URL=http://ritmo-backend:8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - ritmo-backend
    restart: unless-stopped

  # Nginx (required for domain configuration)
  nginx:
    build:
      context: ./nginx
    container_name: ritmo-nginx
    depends_on:
      - ritmo-frontend
      - ritmo-backend
    restart: unless-stopped
