version: '3.8'

services:
  # Domain service (required for domain routing)
  db:
    build:
      context: ./ritmo-frontend/landing
      dockerfile: Dockerfile
    container_name: db
    ports:
      - "80:80"
    depends_on:
      - ritmo-backend
    restart: unless-stopped

  # Frontend React/Vite con Nginx
  ritmo-frontend:
    build:
      context: ./ritmo-frontend/landing
      dockerfile: Dockerfile
    container_name: ritmo-frontend
    depends_on:
      - ritmo-backend
    restart: unless-stopped

  # Backend FastAPI
  ritmo-backend:
    build:
      context: ./ritmo-backend
      dockerfile: Dockerfile
    container_name: ritmo-backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ENVIRONMENT=production
      - PORT=${PORT:-8000}
    restart: unless-stopped

  # Telegram Bot
  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${BOT_TOKEN}
      - BOT_TOKEN=${BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - RITMO_BACKEND_URL=http://ritmo-backend:8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - OPENAI_MODEL=gpt-4o-mini
    depends_on:
      - ritmo-backend
    restart: unless-stopped
