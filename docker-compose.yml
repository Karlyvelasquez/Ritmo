services:
  # Frontend React/Vite con Nginx
  ritmo-frontend:
    build:
      context: ./ritmo-frontend/landing
    container_name: ritmo-frontend
    ports:
      - "3000:80"  # Puerto 3000 para el frontend
    depends_on:
      - ritmo-backend
    restart: unless-stopped
    networks:
      - ritmo-network

  # Backend FastAPI
  ritmo-backend:
    build:
      context: ./ritmo-backend
    container_name: ritmo-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ENVIRONMENT=production
    volumes:
      - ./ritmo-backend:/app
    restart: unless-stopped
    networks:
      - ritmo-network

  # Telegram Bot
  telegram-bot:
    build:
      context: ./telegram-bot
    container_name: telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BACKEND_URL=http://ritmo-backend:8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - ritmo-backend
    restart: unless-stopped
    networks:
      - ritmo-network

  # Nginx como Reverse Proxy (opcional)
  nginx:
    build:
      context: ./nginx
    container_name: ritmo-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - ritmo-frontend
      - ritmo-backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # Para certificados SSL si los tienes
    restart: unless-stopped
    networks:
      - ritmo-network

networks:
  ritmo-network:
    driver: bridge

volumes:
  postgres_data:  # Por si necesitas base de datos local en el futuro
