# =============================================================================
# RENDER.COM DEPLOYMENT - RITMO PLATFORM  
# Deploy Backend + Frontend + Bot automáticamente
# =============================================================================

services:
  # BACKEND API (FastAPI)
  - type: web
    name: ritmo-backend
    runtime: python3
    plan: starter  # Gratis por 90 días, luego $7/mes
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: ./ritmo-backend
    healthCheckPath: /health
    disk:
      name: ritmo-backend-disk
      mountPath: /opt/render
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION  
        value: "3.11.0"

  # FRONTEND (React/Vite)  
  - type: web
    name: ritmo-frontend
    runtime: static
    plan: starter  # Gratis para sitios estáticos
    buildCommand: "cd ritmo-frontend/landing && npm install && npm run build"
    staticPublishPath: ./ritmo-frontend/landing/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite  
        source: /*
        destination: /index.html

  # TELEGRAM BOT (Background Service)
  - type: worker
    name: ritmo-telegram-bot  
    runtime: python3
    plan: starter
    buildCommand: "cd telegram-bot && pip install -r requirements.txt"
    startCommand: "cd telegram-bot && python bot.py"
    rootDir: ./telegram-bot

# =============================================================================
# AUTO-DEPLOYMENT DESDE GITHUB
# 1. Sube tu código a GitHub
# 2. Conecta render.com a tu repositorio  
# 3. Render detecta automáticamente este archivo
# 4. Deploy automático en cada push a main/master
# =============================================================================