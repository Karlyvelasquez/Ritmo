# =============================================================================
# RENDER.COM DEPLOYMENT - RITMO PLATFORM (SOLO FRONTEND GRATUITO)
# Solo despliega el frontend - Backend y Bot requieren tarjeta
# =============================================================================

services:
  # FRONTEND (React/Vite) - COMPLETAMENTE GRATUITO
  - type: web
    name: ritmo-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    rootDir: ./ritmo-frontend/landing
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite  
        source: /*
        destination: /index.html

# =============================================================================
# NOTA: Backend y Bot comentados porque requieren tarjeta de crédito
# Para usarlos, descomenta y agrega tarjeta en render.com
